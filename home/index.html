<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Jairo Famador - Personal Profile</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app" class="container">
        <!-- Added a theme toggle button -->
        <button onclick="toggleTheme()" id="themeToggle">Toggle Dark/Light Mode</button>

        <!-- Added a language selector -->
        <select id="languageSelect" onchange="changeLanguage()">
            <option value="en">English</option>
            <option value="tl">Tagalog</option>
        </select>

        <header class="header text-center py-5">
            <h1 class="display-4">Claude Jairo Famador</h1>
            <p class="lead">Personal Profile and Portfolio</p>
            <!-- Added a typing effect container -->
            <div id="typingEffect"></div>
        </header>

        <!-- Rest of your existing content remains the same until the scripts section -->

        <!-- Added print button before footer -->
        <button onclick="printPortfolio()" class="mt-3">Print Portfolio</button>

        <!-- Added contact form -->
        <div class="mt-4">
            <h3>Contact Me</h3>
            <form id="contactForm" onsubmit="handleSubmit(event)">
                <div>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </div>
                <div>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </div>

        <footer class="footer text-center mt-5 py-3">
            <!-- Added last updated date -->
            <p>Last Updated: <span id="lastUpdated"></span></p>
            <p>© 2024 Claude Jairo Famador | Personal Portfolio</p>
        </footer>
    </div>

    <!-- Your existing scripts -->
    <script src="js/fortnitehamburger.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <script src="js/app.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Added new JavaScript for our features -->
    <script src="js/darktheme.js"></script>
    <script src="js/typing.js"></script>
</body>
</html>
